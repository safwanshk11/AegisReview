# Render Blueprint — deploys both AegisReview services from this repo.
# In Render: New → Blueprint → connect this repo. Docs: https://render.com/docs/blueprint-spec
services:
  # --- Backend: FastAPI, a real always-on web service (no serverless timeout) ---
  - type: web
    name: aegis-backend
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: GEMINI_API_KEY
        sync: false                       # paste your Gemini key in the dashboard
      - key: GITHUB_TOKEN
        sync: false                       # optional: raises GitHub archive rate limits
      - key: AEGIS_LLM_MODEL
        value: gemini-flash-latest
      - key: AEGIS_REVIEW_LIMIT
        value: "6"
      - key: ALLOWED_ORIGINS
        sync: false                       # set to the frontend URL, e.g. https://aegis-frontend.onrender.com

  # --- Frontend: static Vite build ---
  - type: web
    name: aegis-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false                       # set to the backend URL, e.g. https://aegis-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
